name: Plugin Check

# Runs the official WordPress.org "Plugin Check" (PCP) tool — the same
# checker family WordPress.org's automated release-review pipeline uses
# for security/performance scanning. Free, official, Apache-2.0 licensed:
# https://github.com/WordPress/plugin-check-action
#
# The "plugin_repo" category (readme.txt format, trademarks, prefixing) is
# skipped for now; security, performance and general checks still apply.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      # The action activates the plugin as-is from the checkout, so the Composer
      # autoloader must exist (production dependencies only, like the release zip).
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          # The checkout directory is named after the repository (PurgeKit); the real slug is lowercase.
          slug: purgekit
          strict: true
          exclude-directories: 'vendor,tests,node_modules,.github,build-src,coverage'
          categories: |
            security
            performance
            general